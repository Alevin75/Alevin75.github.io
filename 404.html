<script>
/* Убираем экран загрузки, когда приложение сообщило, что первый экран готов.
   Событие отправляет app/_layout.tsx, когда заканчивается живая заставка. */
(function () {
  var splash = document.getElementById('ostrov-splash');
  if (!splash) return;

  var done = false;
  function hide() {
    if (done) return;
    done = true;
    splash.style.opacity = '0';
    setTimeout(function () { if (splash.parentNode) splash.parentNode.removeChild(splash); }, 500);
  }

  window.addEventListener('ostrov-ready', hide);

  /* Страховка на случай, если приложение не успело подать сигнал (медленная
     сеть, старый браузер): убираем заставку, когда страница полностью
     загрузилась, ещё через пять секунд. */
  window.addEventListener('load', function () { setTimeout(hide, 5000); });

  /* И вторая страховка — чтобы заставка не осталась навсегда. */
  setTimeout(hide, 30000);
})();
</script>
