<style id="ostrov-shell">
  html, body, #root {
    font-family: 'Inter-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background-color: #f6f5f1;
  }
  html { -webkit-text-size-adjust: 100%; }

  /* ------------------------------------------------------------------
     Экран загрузки: падение с неба.
     Все элементы стоят в конечном положении — так заставка корректно
     выглядит при выключенных анимациях (система «меньше движения» или
     повторный заход в той же сессии).
     ------------------------------------------------------------------ */
  #ostrov-splash {
    position: fixed; inset: 0; z-index: 9999; overflow: hidden;
    background: #dfe7ea; color: #10120e;
    transition: opacity .5s ease;
    font-family: 'Inter-Regular', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: manipulation;
  }
  #ostrov-splash.sp-hide { opacity: 0; }

  /* Камера: чуть больше кадра, чтобы края не оголялись при дрожании. */
  #ostrov-splash .sp-cam { position: absolute; inset: -1%; }

  /* Небо — запасной фон, если видео ещё не подошло. */
  #ostrov-splash .sp-sky {
    position: absolute; inset: 0;
    background: radial-gradient(120% 80% at 50% 18%, #e2eaee 0%, #c0d0d8 42%, #94aab7 72%, #7d94a1 100%);
  }

  /* Земля: дальний и ближний спутниковые снимки. Дальний — маленькое пятно
     в небе, оно растёт; у него растворяются края, чтобы не было прямоугольника.
     Ближний — сам глэмпинг, ложится поверх и остаётся до конца. */
  #ostrov-splash .sp-far,
  #ostrov-splash .sp-near {
    position: absolute; inset: 0;
    background-position: 50% 50%;
    background-size: cover;
    will-change: transform, opacity;
  }
  #ostrov-splash .sp-far {
    background-image: url('./splash/ground-far.jpg');
    transform: scale(.5);
    opacity: 1;
    -webkit-mask-image: radial-gradient(closest-side, #000 40%, rgba(0,0,0,.55) 58%, rgba(0,0,0,0) 74%);
    mask-image: radial-gradient(closest-side, #000 40%, rgba(0,0,0,.55) 58%, rgba(0,0,0,0) 74%);
  }
  #ostrov-splash .sp-near {
    background-image: url('./splash/ground-near.jpg');
    transform: scale(1.02);
    opacity: 0;
  }

  /* Настоящая съёмка падения. Постер — первый кадр того же ролика,
     поэтому подмена не видна, даже если видео не успело загрузиться.
     Для телефона отдельный вертикальный ролик: из широкого кадра 9:16
     вырезается центр, иначе руки и земля превращаются в узкую щёлку. */
  #ostrov-splash .sp-video {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: cover; object-position: 50% 50%;
    background: #0b1216 url('./splash/fall-wide-poster.jpg') 50% 50% / cover no-repeat;
    opacity: 0;
    transform: scale(1.04);
    filter: saturate(.95) contrast(1.03) brightness(.99);
    will-change: transform, opacity;
  }
  @media (max-aspect-ratio: 3/4) {
    #ostrov-splash .sp-video {
      background-image: url('./splash/fall-tall-poster.jpg');
    }
  }

  /* Облачная пелена на стыке «небо → снимок»: сильно размытая полоса света. */
  #ostrov-splash .sp-veil {
    position: absolute; inset: -10%;
    background: radial-gradient(120% 92% at 50% 52%, rgba(255,255,255,1) 0%, rgba(255,255,255,.96) 42%, rgba(255,255,255,.6) 62%, rgba(255,255,255,0) 84%);
    filter: blur(18px);
    opacity: 0;
    will-change: opacity;
  }

  /* Затемнение по краям: взгляд вниз, объектив «зажат». */
  #ostrov-splash .sp-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 42%, rgba(8,12,10,.5) 100%);
  }

  /* Вспышка на посадке. */
  #ostrov-splash .sp-flash { position: absolute; inset: 0; background: #fff; opacity: 0; }

  /* Мягкая тень под надписью, чтобы белый текст читался на любом снимке. */
  #ostrov-splash .sp-scrim {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(64% 24% at 50% 50%, rgba(8,12,10,.5) 0%, rgba(8,12,10,.28) 46%, rgba(8,12,10,0) 78%);
    opacity: 0;
  }

  /* Надпись: конечное положение — по центру. */
  #ostrov-splash .sp-lockup {
    position: absolute; left: 0; right: 0; top: 50%;
    text-shadow: 0 2px 22px rgba(0,0,0,.35);
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    text-align: center; padding: 0 24px;
    opacity: 1;
  }
  #ostrov-splash .sp-small {
    font-size: 11px; letter-spacing: .34em; text-transform: uppercase;
    color: rgba(251,247,244,.9);
    text-shadow: 0 1px 12px rgba(0,0,0,.7);
  }
  #ostrov-splash .sp-name {
    font-family: 'CormorantGaramond-Regular', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: clamp(34px, 10.5vw, 52px);
    letter-spacing: .15em; text-transform: uppercase; line-height: 1;
    color: #fbf7f4;
    text-shadow: 0 2px 28px rgba(0,0,0,.6), 0 1px 2px rgba(0,0,0,.45);
    margin-left: .15em;
  }
  #ostrov-splash .sp-line {
    width: 132px; height: 2px; background: rgba(251,247,244,.3);
    overflow: hidden; border-radius: 2px; margin-top: 2px;
  }
  #ostrov-splash .sp-line i {
    display: block; height: 100%; width: 100%; background: #c2603f; border-radius: 2px;
    transform-origin: left center;
  }

  /* ------------------------------------------------------------------
     Движение: 5 секунд от неба до надписи.
     ------------------------------------------------------------------ */
  @media (prefers-reduced-motion: no-preference) {
    #ostrov-splash.sp-play .sp-video   { animation: sp-video 5s linear forwards; }
    #ostrov-splash.sp-play .sp-far     { animation: sp-far 5s cubic-bezier(.4,0,.7,1) forwards; }
    #ostrov-splash.sp-play .sp-near    { animation: sp-near 5s cubic-bezier(.45,0,.6,1) forwards; }
    #ostrov-splash.sp-play .sp-veil    { animation: sp-veil 5s ease-in-out forwards; }
    #ostrov-splash.sp-play .sp-scrim   { animation: sp-scrim 5s ease-in-out forwards; }
    #ostrov-splash.sp-play .sp-lockup  { animation: sp-lockup 5s ease-out forwards; }
    #ostrov-splash.sp-play .sp-line i  { animation: sp-line 5s linear forwards; }
    #ostrov-splash.sp-play .sp-flash   { animation: sp-flash 5s ease-out forwards; }
  }

  /* Падение: кадр приближается, к облаку выбеливается и растворяется. */
  @keyframes sp-video {
    0%   { opacity: 0; transform: scale(1.04); filter: saturate(.95) contrast(1.03) brightness(.99) blur(0px); }
    7%   { opacity: 1; }
    46%  { opacity: 1; transform: scale(1.11); filter: saturate(.95) contrast(1.03) brightness(1.00) blur(0px); }
    54%  { opacity: 1; transform: scale(1.14); filter: saturate(.9) contrast(1.0) brightness(1.35) blur(2px); }
    61%  { opacity: 0; transform: scale(1.17); filter: saturate(.8) contrast(.96) brightness(2.1) blur(9px); }
    100% { opacity: 0; transform: scale(1.18); filter: saturate(.8) contrast(.96) brightness(2.1) blur(9px); }
  }

  /* Район: маленькое пятно земли, растёт до кадра на весь экран. */
  @keyframes sp-far {
    0%   { transform: scale(.5); }
    40%  { transform: scale(.6); }
    62%  { transform: scale(.82); }
    100% { transform: scale(1.06); }
  }

  /* Сам глэмпинг: включается под белой пеленой, поэтому смена кадра не видна. */
  @keyframes sp-near {
    0%, 57% { opacity: 0; transform: scale(1); }
    59%     { opacity: 1; transform: scale(1); }
    100%    { opacity: 1; transform: scale(1.1); }
  }

  /* Белая пелена: кадр «влетает в облако», под ней меняется съёмка на снимок. */
  @keyframes sp-veil {
    0%, 50% { opacity: 0; }
    60%     { opacity: .96; }
    70%     { opacity: 0; }
    100%    { opacity: 0; }
  }

  @keyframes sp-scrim {
    0%, 68% { opacity: 0; }
    86%     { opacity: 1; }
    100%    { opacity: 1; }
  }

  /* Надпись встаёт, когда земля уже на месте. */
  @keyframes sp-lockup {
    0%, 72% { opacity: 0; transform: translateY(-50%) scale(.95); }
    88%     { opacity: 1; transform: translateY(-50%) scale(1); }
    100%    { opacity: 1; transform: translateY(-50%) scale(1.004); }
  }

  /* Полоска под надписью — «как идёт загрузка». */
  @keyframes sp-line {
    0%, 74% { transform: scaleX(0); }
    90%     { transform: scaleX(.75); }
    98%     { transform: scaleX(.96); }
    100%    { transform: scaleX(1); }
  }

  /* Вспышка на посадке. */
  @keyframes sp-flash {
    0%, 88% { opacity: 0; }
    93%     { opacity: .45; }
    100%    { opacity: 0; }
  }

  @media (prefers-reduced-motion: reduce) {
    #ostrov-splash .sp-video { display: none; }
    #ostrov-splash .sp-veil { opacity: 0; }
    #ostrov-splash .sp-flash { opacity: 0; }
    #ostrov-splash .sp-line i { transform: scaleX(.7); }
  }
</style>

               data-wide="./splash/fall-wide.mp4" data-tall="./splash/fall-tall.mp4"></video>
        <script>
          /* Ролик под экран: на телефоне — вертикальный кадр, на большом — широкий. */

<script>
/* Экран загрузки «падение с неба».
     • анимация один раз за сессию; ?splash=1 — посмотреть ещё раз;
     • убираем заставку, когда и анимация дошла до надписи, и первый экран
       приложения готов;
     • касание перематывает к надписи;
     • страховки снимают заставку, если приложение не подало сигнал. */
(function () {
  var splash = document.getElementById('ostrov-splash');
  if (!splash) return;

  var HOLD = 4400;          /* к этому моменту надпись уже стоит */
  var started = Date.now();
  var ready = false;
  var hidden = false;
  var holdTimer = 0;
  var video = splash.querySelector('.sp-video');

  /* ?splash=1 — показать заставку заново, даже если в этой сессии уже видели. */
  var force = /[?&]splash=1/.test(location.search);
  if (force) { try { sessionStorage.removeItem('ostrov-splash-seen'); } catch (e) {} }

  var seen = false;
  try { seen = !force && sessionStorage.getItem('ostrov-splash-seen') === '1'; } catch (e) {}

  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var quick = seen || calm;

  if (quick) {
    /* Не тратим трафик: заставка не играет — ролик не нужен. */
    if (video) {
      try { video.pause(); video.removeAttribute('src'); video.load(); } catch (e) {}
    }
  } else {
    splash.classList.add('sp-play');
    if (video) {
      try {
        video.currentTime = 0;
        var p = video.play();
        if (p && p.catch) p.catch(function () {});
      } catch (e) {}
    }
  }

  function hide() {
    if (hidden) return;
    hidden = true;
    splash.classList.add('sp-hide');
    try { sessionStorage.setItem('ostrov-splash-seen', '1'); } catch (e) {}
    setTimeout(function () {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 600);
  }

  function maybeHide() {
    if (!ready) return;
    var left = Math.max(0, (quick ? 260 : HOLD) - (Date.now() - started));
    clearTimeout(holdTimer);
    holdTimer = setTimeout(hide, left);
  }

  window.addEventListener('ostrov-ready', function () {
    ready = true;
    maybeHide();
  });

  function skip() {
    if (hidden || quick) return;
    quick = true;
    splash.classList.remove('sp-play');
    if (video) { try { video.pause(); } catch (e) {} }
    maybeHide();
  }
  splash.addEventListener('click', skip);
  splash.addEventListener('touchstart', skip, { passive: true });
  window.addEventListener('keydown', skip);

  window.addEventListener('load', function () {
    setTimeout(function () { ready = true; maybeHide(); }, 8000);
  });
  setTimeout(function () { ready = true; maybeHide(); }, 15000);
})();
</script>
