<style id="ostrov-shell">
html, body, #root {
    font-family: 'Inter-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background-color: #f6f5f1;
  }
  html { -webkit-text-size-adjust: 100%; }

  /* ------------------------------------------------------------------
     ЭКРАН ЗАГРУЗКИ: полёт от Европы и Азии к озеру Копыто за 8 секунд.

     Девять спутниковых кадров вокруг острова. Каждый следующий в 3-5 раз
     подробнее предыдущего; масштаб идёт по экспоненте, поэтому скорость
     не «рвётся» — чем ближе, тем медленнее. Соседние кадры растворяются
     друг в друге, край нового кадра мягкий, и стыка не видно.
     Облаков нет: только карта, виньетка и надпись.
     ------------------------------------------------------------------ */
  #ostrov-splash {
    position: fixed; inset: 0; z-index: 9999; overflow: hidden;
    background: #0b1410;
    transition: opacity .5s ease;
    font-family: 'Inter-Regular', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: manipulation;
  }
  #ostrov-splash.sp-hide { opacity: 0; }

  #ostrov-splash .sp-gl {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%;
    opacity: 0; transition: opacity .6s ease;
  }
  #ostrov-splash.sp-live .sp-gl { opacity: 1; }

  /* Если WebGL нет — тихий финальный кадр: озеро Копыто. */
  #ostrov-splash .sp-still {
    position: absolute; inset: 0;
    background: #0b1410 url('./splash/sat-still.webp') 50% 50% / cover no-repeat;
    opacity: 0; transition: opacity .4s ease;
  }
  #ostrov-splash.sp-no-3d .sp-still { opacity: 1; }

  /* Виньетка: по краям темнее, взгляд собирается в центре. */
  #ostrov-splash .sp-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(118% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(4,10,8,.42) 100%);
  }

  /* Бумажная крупа — чтобы картинка не выглядела стерильным рендером. */
  #ostrov-splash .sp-grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: .06; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  /* Пелена — больше не нужна (облаков нет), оставлена пустой на случай возврата. */
  #ostrov-splash .sp-veil {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 96% at 50% 46%, #ffffff 0%, #f4f7f8 58%, #e8eff1 100%);
  }

  /* Вспышка на посадке. */
  #ostrov-splash .sp-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* Низ кадра темнеет — на нём стоит надпись. */
  #ostrov-splash .sp-floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 40%;
    pointer-events: none; opacity: 0;
    background: linear-gradient(180deg,
      rgba(8,16,12,0) 0%, rgba(8,16,12,.44) 38%,
      rgba(8,16,12,.80) 70%, rgba(8,16,12,.93) 100%);
  }

  /* Надпись: тонкая, разреженная, в две строки с волоском под ней. */
  #ostrov-splash .sp-lockup {
    position: absolute; left: 0; right: 0; top: 79.5%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; padding: 0 24px;
    opacity: 0;
  }
  #ostrov-splash .sp-small {
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
    color: rgba(255,255,255,.84);
    text-shadow: 0 1px 16px rgba(0,0,0,.65);
  }
  #ostrov-splash .sp-name {
    font-family: 'CormorantGaramond-Regular', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: clamp(38px, 11.5vw, 56px);
    letter-spacing: .17em; text-transform: uppercase; line-height: 1;
    color: #ffffff;
    text-shadow: 0 2px 30px rgba(0,0,0,.62), 0 1px 4px rgba(0,0,0,.4);
    margin-left: .17em;
  }
  #ostrov-splash .sp-line {
    width: 124px; height: 2px; background: rgba(255,255,255,.26);
    overflow: hidden; border-radius: 2px; margin-top: 6px;
  }
  #ostrov-splash .sp-line i {
    display: block; height: 100%; width: 100%; background: #c2603f; border-radius: 2px;
    transform-origin: left center; transform: scaleX(0);
  }

  /* ------------------------------------------------------------------
     Тайминг: 0.0 старт над Европой → 8.2 озеро Копыто → 9.0 заставка уходит.
     ------------------------------------------------------------------ */
  @media (prefers-reduced-motion: no-preference) {
    #ostrov-splash.sp-play .sp-lockup { animation: sp-lockup 8.6s cubic-bezier(.2,.8,.3,1) forwards; }
    #ostrov-splash.sp-play .sp-line i { animation: sp-line 8.6s linear forwards; }
    #ostrov-splash.sp-play .sp-flash  { animation: sp-flash 8.6s ease-out forwards; }
    #ostrov-splash.sp-play .sp-vignette { animation: sp-vig 8.6s ease-out forwards; }
    #ostrov-splash.sp-play .sp-floor { animation: sp-floor 8.6s ease-out forwards; }
  }

  /* Надпись встаёт, когда озеро уже близко. */
  @keyframes sp-lockup {
    0%, 74% { opacity: 0; transform: translateY(-46%) scale(.985); }
    86%     { opacity: 1; transform: translateY(-50%) scale(1); }
    100%    { opacity: 1; transform: translateY(-50%) scale(1.004); }
  }

  /* Волосок под надписью — «как идёт загрузка». */
  @keyframes sp-line {
    0%, 78% { transform: scaleX(0); }
    92%     { transform: scaleX(.62); }
    97%     { transform: scaleX(.92); }
    100%    { transform: scaleX(1); }
  }

  /* Вспышка на посадке. */
  @keyframes sp-flash {
    0%, 93% { opacity: 0; }
    95%     { opacity: .10; }
    98%     { opacity: 0; }
    100%    { opacity: 0; }
  }

  /* Тёмный низ поднимается к финалу. */
  @keyframes sp-floor {
    0%, 70% { opacity: 0; }
    88%     { opacity: .92; }
    100%    { opacity: 1; }
  }

  /* Виньетка по ходу полёта сгущается. */
  @keyframes sp-vig {
    0%   { opacity: .3; }
    50%  { opacity: .6; }
    100% { opacity: 1; }
  }

  /* Меньше движения: сразу финальный кадр с надписью. */
  @media (prefers-reduced-motion: reduce) {
    #ostrov-splash .sp-gl { display: none; }
    #ostrov-splash .sp-still { opacity: 1; }
    #ostrov-splash .sp-lockup { opacity: 1; transform: translateY(-50%); }
    #ostrov-splash .sp-line i { transform: scaleX(.7); }
    #ostrov-splash .sp-flash { opacity: 0; }
    #ostrov-splash .sp-floor { opacity: 1; }
    #ostrov-splash .sp-vignette { opacity: 1; }
  }
</style>

<script>
(function () {
  var splash = document.getElementById('ostrov-splash');
  if (!splash) return;

  var seen = false;
  try { seen = sessionStorage.getItem('ostrov-splash-seen') === '1'; } catch (e) {}
  var forced = /[?&]splash=1/.test(location.search);
  if (seen && !forced) {
    if (splash.parentNode) splash.parentNode.removeChild(splash);
    return;
  }
  try { sessionStorage.setItem('ostrov-splash-seen', '1'); } catch (e) {}

  var FLIGHT = 8.2;      /* секунды полёта: вся Европа -> озеро Копыто */
  var HOLD = 9000;       /* сколько заставка живёт минимум, мс */
  var started = Date.now();
  var ready = false, hidden = false, quick = false;
  var holdTimer = 0;

  /* ?t=6.5 — застывший кадр для проверки, prefers-reduced-motion — статичная картинка.

     Внимание: тот же параметр t= носит код брони в ссылке из СМС.
     Число — тестовый кадр, буквы с цифрами — код гостя, поэтому
     застывший кадр включаем только если после t= стоит именно число. */
  var TEST_FRAME = /^[0-9]+([.][0-9]+)?$/;
  var FROM_LINK = /[?&]t=([^&#]+)/;
  var inAddress = FROM_LINK.exec(location.search);
  var inReferrer = FROM_LINK.exec(document.referrer || '');
  var ownCode = inAddress ? inAddress[1] : '';
  var FREEZE = ownCode && TEST_FRAME.test(ownCode) ? parseFloat(ownCode) : NaN;
  var still = !isFinite(FREEZE) && window.matchMedia &&
              window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Гость по ссылке из СМС: полёт от Европы не нужен, ведём сразу
     к делу. Внутри страницы Tilda адрес с параметром приходит
     в referrer. */
  var guestCode = ownCode && !TEST_FRAME.test(ownCode) ? ownCode
    : (inReferrer && !TEST_FRAME.test(inReferrer[1])
       ? inReferrer[1] : '');
  if (guestCode) {
    FLIGHT = 1.2;   /* секунды: короткий подлёт вместо круга */
    HOLD = 3000;    /* дольше трёх секунд заставка не держится */
    /* Код оставляем приложению: внутри страницы Tilda адрес уже без
       параметра, а из sessionStorage приложение его достанет
       (см. src/lib/guestLink.ts). */
    try { sessionStorage.setItem('ostrov-guest-code', guestCode); } catch (e) {}
  }

  function num(v) { return (v < 0 ? 0 : v > 1 ? 1 : v); }
  function ease(v) { return v * v * (3 - 2 * v); }

  /* Кадры заставки. g — сколько метров земли укладывается по стороне кадра,
     поэтому масштаб считается честно и на любом экране. */
  var FRAMES = [
    { f: 'sat-03.webp', g: 11056908 },  /* Европа и Азия целиком */
    { f: 'sat-04.webp', g: 5528454 },   /* Европа */
    { f: 'sat-06.webp', g: 1520325 },
    { f: 'sat-08.webp', g: 345528 },
    { f: 'sat-10.webp', g: 86382 },
    { f: 'sat-12.webp', g: 21596 },
    { f: 'sat-14.webp', g: 5399 },
    { f: 'sat-16.webp', g: 1485 },
    { f: 'sat-17.webp', g: 945 }        /* озеро Копыто */
  ];
  /* Когда начинать качать: старт и финал — сразу, середина — по ходу полёта. */

  function flight(canvas) {

    var VS = 'attribute vec2 a_pos; uniform vec4 u_rect; varying vec2 v_uv;' +
      'void main(){ v_uv = vec2(a_pos.x + 0.5, 0.5 - a_pos.y);' +
      ' gl_Position = vec4(mix(u_rect.x, u_rect.z, a_pos.x + 0.5),' +
      '                    mix(u_rect.y, u_rect.w, a_pos.y + 0.5), 0.0, 1.0); }';

    var FS = 'precision mediump float;' +
      'uniform sampler2D u_tex; uniform float u_alpha; uniform float u_feather;' +
      'varying vec2 v_uv;' +
      'void main(){ vec4 c = texture2D(u_tex, v_uv);' +
      ' float e = min(min(v_uv.x, 1.0 - v_uv.x), min(v_uv.y, 1.0 - v_uv.y));' +
      ' float a = u_alpha * smoothstep(0.0, max(u_feather, 0.0006), e);' +
      ' if (a < 0.003) discard;' +
      ' gl_FragColor = vec4(c.rgb, a); }';

      gl.shaderSource(s, src);
      gl.compileShader(s);

    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([
      -0.5, -0.5,   0.5, -0.5,  -0.5, 0.5,   0.5, 0.5
    ]), gl.STATIC_DRAW);
    var aPos = gl.getAttribLocation(pr, 'a_pos');
    gl.enableVertexAttribArray(aPos);
    gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 8, 0);

    var uAlpha = gl.getUniformLocation(pr, 'u_alpha');
    var uFeather = gl.getUniformLocation(pr, 'u_feather');

       чтобы не осталось полей: на широком экране — по ширине. */
    function cover() { return Math.max(1, W / H); }

    /* Видимый кусок земли (метров по высоте экрана) в момент t. */

      var g0 = FRAMES[0].g / (cv * 1.02);

    }

    function draw(idx, g, alpha, feather) {
      var size = (FRAMES[idx].g / g) * H;         /* сторона кадра на экране, px */
      var hx = size / W, hy = size / H;           /* половина — в координатах клипа */
      gl.bindTexture(gl.TEXTURE_2D, texs[idx].t);
      gl.uniform4f(uRect, -hx, -hy, hx, hy);
      gl.uniform1f(uAlpha, alpha);
      gl.uniform1f(uFeather, feather);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function render(t) {
      gl.clear(gl.COLOR_BUFFER_BIT);
      var g = ground(t);
      var cv = cover();

      /* Опорный кадр — самый подробный из тех, что ещё закрывают весь экран. */
      var base = -1;
      for (var i = 0; i < FRAMES.length; i++) {
        if (texs[i].ready && FRAMES[i].g / g >= cv * 0.998) base = i;
      }
      window.spDebug = { t: Math.round(t * 100) / 100, g: Math.round(g),
                         base: base, w: W, h: H };

      if (base < 0) return;
      draw(base, g, 1.0, 0.0);

      /* Следующий кадр подробнее: он всегда меньше экрана, поэтому въезжает
         мягким пятном с растворением — стыка не видно, картинка одна и та же.
         Растворение заканчивается ровно в тот миг, когда кадр закрывает экран
         и становится опорным. */
      var top = base + 1;
      if (top < FRAMES.length && texs[top].ready) {
        var rel = FRAMES[top].g / g;
        var a = ease(num((rel / cv - 0.30) / 0.55));
        if (a > 0.004) draw(top, g, a, 0.14);
      }
    }

    var startedAt = 0, raf = 0;
    function loop(now) {
      if (!startedAt) startedAt = now;
      render((now - startedAt) / 1000);
      raf = window.requestAnimationFrame(loop);
    }

    if (isFinite(FREEZE)) {
      render(FREEZE);
    } else if (still) {
      render(FLIGHT);
    } else {
      raf = window.requestAnimationFrame(loop);
    }

    return {
      stop: function () {
        if (raf) window.cancelAnimationFrame(raf);
        raf = 0;
      }
    };
  }

  var canvas = document.getElementById('sp-gl');
  var fly = null;
  if (canvas && !still) {
    try {
      fly = flight(canvas);
    } catch (e) {
      fly = null;
    }
  }
  if (fly) {
    splash.classList.add('sp-live');
    splash.classList.add('sp-play');
  } else {
    splash.classList.add('sp-no-3d');
  }

  function hide() {
    if (hidden) return;
    hidden = true;
    if (fly) fly.stop();
    splash.classList.add('sp-hide');
    setTimeout(function () {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 620);
  }

  function skip() {
    if (hidden || quick) return;
    quick = true;
    splash.classList.remove('sp-play');
    splash.classList.add('sp-hide');
    if (fly) fly.stop();
    setTimeout(hide, 240);
  }
  splash.addEventListener('click', skip);
  splash.addEventListener('touchstart', skip, { passive: true });
  window.addEventListener('keydown', skip);

  function maybeHide() {
    if (!ready || hidden) return;
    var left = Math.max(0, HOLD - (Date.now() - started));
    clearTimeout(holdTimer);
    holdTimer = setTimeout(hide, left);
  }

  window.addEventListener('ostrov-ready', function () {
    ready = true;
    maybeHide();
  });

  window.addEventListener('load', function () {
    setTimeout(function () { ready = true; maybeHide(); }, 60000);
  });
  setTimeout(function () { ready = true; maybeHide(); }, 75000);
})();
</script>

</body>
</html>
