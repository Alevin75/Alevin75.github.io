<style id="ostrov-shell">
  html, body, #root {
    font-family: 'Inter-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background-color: #f6f5f1;
  }
  html { -webkit-text-size-adjust: 100%; }

  /* ------------------------------------------------------------------
     ЭКРАН ЗАГРУЗКИ: падение с неба на диораму острова за 5 секунд.

     Сцена рисуется в WebGL: горизонтальная плоскость с фирменной картой
     и этажи облаков на разной высоте. Камера падает сверху вниз, проходит
     сквозь облака (кадр белеет), облака проносятся мимо, внизу растёт
     остров, камера садится, собирается надпись. Всё остальное — бумажное
     зерно, виньетка и надпись — обычные слои поверх холста.
     ------------------------------------------------------------------ */
  #ostrov-splash {
    position: fixed; inset: 0; z-index: 9999; overflow: hidden;
    background: linear-gradient(180deg, #5f9dc7 0%, #7cb0cf 52%, #a6c8dc 100%);
    transition: opacity .5s ease;
    font-family: 'Inter-Regular', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: manipulation;
  }
  #ostrov-splash.sp-hide { opacity: 0; }

  #ostrov-splash .sp-gl {
    position: absolute; inset: 0; display: block;
    width: 100%; height: 100%;
    opacity: 0; transition: opacity .6s ease;
  }
  #ostrov-splash.sp-live .sp-gl { opacity: 1; }

  /* Если WebGL нет — тихий финальный кадр. */
  #ostrov-splash .sp-still {
    position: absolute; inset: 0;
    background: #7cb0cf url('./splash/diorama.png') 50% 50% / 100% 100% no-repeat;
    opacity: 0; transition: opacity .4s ease;
  }
  #ostrov-splash.sp-no-3d .sp-still { opacity: 1; }

  /* Виньетка: взгляд вниз, по краям чуть темнее. */
  #ostrov-splash .sp-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(118% 78% at 50% 46%, rgba(0,0,0,0) 42%, rgba(10,22,26,.30) 100%);
  }

  /* Бумажная крупа — чтобы картинка не выглядела стерильным рендером. */
  #ostrov-splash .sp-grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: .07; mix-blend-mode: multiply;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  /* Пелена: камера проходит сквозь облако — кадр на миг белеет.
     Управляется из JS по высоте камеры. */
  #ostrov-splash .sp-veil {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(120% 96% at 50% 46%, #ffffff 0%, #f4f7f8 58%, #e8eff1 100%);
  }

  /* Вспышка на посадке. */
  #ostrov-splash .sp-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* Светлое подножие: к посадке низ кадра уходит в облачную пелену,
     на ней стоит надпись. */
  #ostrov-splash .sp-floor {
    position: absolute; left: 0; right: 0; bottom: 0; height: 42%;
    pointer-events: none; opacity: 0;
    background: linear-gradient(180deg,
      rgba(251,251,249,0) 0%, rgba(251,251,249,.55) 38%,
      rgba(251,251,249,.94) 68%, #fbfbf9 100%);
  }

  /* Надпись: тонкая, разреженная, в две строки с волоском под ней. */
  #ostrov-splash .sp-lockup {
    position: absolute; left: 0; right: 0; top: 79.5%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    text-align: center; padding: 0 24px;
    opacity: 0;
  }
  #ostrov-splash .sp-small {
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
    color: rgba(34,48,42,.78);
    text-shadow: 0 1px 14px rgba(255,255,255,.9);
  }
  #ostrov-splash .sp-name {
    font-family: 'CormorantGaramond-Regular', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: clamp(38px, 11.5vw, 56px);
    letter-spacing: .17em; text-transform: uppercase; line-height: 1;
    color: #22302a;
    text-shadow: 0 2px 26px rgba(255,255,255,.95), 0 1px 3px rgba(255,255,255,.95);
    margin-left: .17em;
  }
  #ostrov-splash .sp-line {
    width: 124px; height: 2px; background: rgba(34,48,42,.16);
    overflow: hidden; border-radius: 2px; margin-top: 6px;
  }
  #ostrov-splash .sp-line i {
    display: block; height: 100%; width: 100%; background: #c2603f; border-radius: 2px;
    transform-origin: left center; transform: scaleX(0);
  }

  /* ------------------------------------------------------------------
     Тайминг: 0.00 падение → 3.30 надпись → 4.20 посадка.
     ------------------------------------------------------------------ */
  @media (prefers-reduced-motion: no-preference) {
    #ostrov-splash.sp-play .sp-lockup { animation: sp-lockup 5s cubic-bezier(.2,.8,.3,1) forwards; }
    #ostrov-splash.sp-play .sp-line i { animation: sp-line 5s linear forwards; }
    #ostrov-splash.sp-play .sp-flash  { animation: sp-flash 5s ease-out forwards; }
    #ostrov-splash.sp-play .sp-vignette { animation: sp-vig 5s ease-out forwards; }
    #ostrov-splash.sp-play .sp-floor { animation: sp-floor 5s ease-out forwards; }
  }

  /* Надпись встаёт, когда остров уже на месте. */
  @keyframes sp-lockup {
    0%, 66% { opacity: 0; transform: translateY(-46%) scale(.985); }
    79%     { opacity: 1; transform: translateY(-50%) scale(1); }
    100%    { opacity: 1; transform: translateY(-50%) scale(1.004); }
  }

  /* Волосок под надписью — «как идёт загрузка». */
  @keyframes sp-line {
    0%, 72% { transform: scaleX(0); }
    90%     { transform: scaleX(.62); }
    97%     { transform: scaleX(.92); }
    100%    { transform: scaleX(1); }
  }

  /* Вспышка на посадке. */
  @keyframes sp-flash {
    0%, 82% { opacity: 0; }
    87%     { opacity: .12; }
    93%     { opacity: 0; }
    100%    { opacity: 0; }
  }

  /* Пелена снизу поднимается к посадке. */
  @keyframes sp-floor {
    0%, 58% { opacity: 0; }
    80%     { opacity: .92; }
    100%    { opacity: 1; }
  }

  /* Виньетка на входе сильнее — падаем в облаке. */
  @keyframes sp-vig {
    0%   { opacity: .35; }
    30%  { opacity: .55; }
    70%  { opacity: .85; }
    100% { opacity: 1; }
  }

  /* Меньше движения: сразу тихий финальный кадр с надписью. */
  @media (prefers-reduced-motion: reduce) {
    #ostrov-splash .sp-gl { display: none; }
    #ostrov-splash .sp-still { opacity: 1; }
    #ostrov-splash .sp-lockup { opacity: 1; transform: translateY(-50%); }
    #ostrov-splash .sp-line i { transform: scaleX(.7); }
    #ostrov-splash .sp-flash { opacity: 0; }
    #ostrov-splash .sp-floor { opacity: 1; }
  }
</style>

    }
    resize();
    window.addEventListener('resize', resize);

    var veilEl = splash.querySelector('.sp-veil');

    function draw(texName, cx, cy, cz, sx, sz, alpha, feather, texAlpha, mvp, up, fade) {
      var t = texs[texName];
      if (!t) return;
      var R2 = [-1, 0, 0], U2 = up || [-1, 0, 0];
      gl.bindTexture(gl.TEXTURE_2D, t);
      gl.uniformMatrix4fv(uMvp, false, mvp);
      gl.uniform3f(uCenter, cx, cy, cz);
      gl.uniform2f(uSize, sx, sz);
      gl.uniform3f(uRight, R2[0], R2[1], R2[2]);
      gl.uniform3f(uUp, U2[0], U2[1], U2[2]);
      gl.uniform1f(uAlpha, alpha);
      gl.uniform1f(uFeather, feather);
      gl.uniform1f(uTexAlpha, texAlpha);
      gl.uniform1f(uFade, fade || 0.0);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }

    function render(t) {
    if (window.__spPix) { window.__spPix = null; }
      /* 0 → 4.2 с падение, дальше кадр держится и чуть доезжает */
      var p = num(t / 4.2);
      var e = 1 - Math.pow(1 - p, 3);
      var k = 1 - e;                            /* 1 — в небе, 0 — сели */
      var shake = k * k * 22;
      var camY = CY + 1700 * k + Math.sin(t * 6.9 + 1.3) * shake * 0.6;
      var camZ = -camEnd - 5200 * k;
      if (t > 4.2) camZ += 22 * (t - 4.2);      /* мягкое доезжание вперёд */
      var camX = -480 * k + Math.sin(t * 8.3) * shake;
      var tY = CY + 420 * k;

      var proj = persp(FOV, aspect, 40, 80000);
      var view = lookAt2(camX, camY, camZ, 0, tY, 0, [0, 1, 0]);
      var mvp = mul(proj, view);

      gl.clear(gl.COLOR_BUFFER_BIT);
      window.spDebug = { t: t, camY: Math.round(camY), camX: Math.round(camX), camZ: Math.round(camZ), left: left, w: W, h: H, aspect: Math.round(aspect*100), camEnd: Math.round(camEnd), n: sprites.length };

      /* карточка-диорама: вертикальное полотно, вырезанное по небу */
      var cardA = num((t - 0.05) / 0.5);
      var VUP = [0, -1, 0], HUP = [0, 0, 1];
      var cardDrawn = false;
      function card() {
        if (cardDrawn) return;
        cardDrawn = true;
        draw('dior', 0, CY, 0, IW, IH, cardA, 0.0, 1.0, mvp, VUP, 0.10 * k);
      }

      /* облака: от дальних к ближним, карточка — на своём месте по глубине */
      function spr(s, i) {
        var ddx = camX - s.x, ddy = camY - s.y, ddz = camZ - s.z;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy + ddz * ddz);
        var near = num((dist - 520) / 900);        /* не липнут к объективу */
        if (near <= 0.002) return;
        var drift = Math.sin(t * 0.6 + i) * s.sp;
        draw(s.tex, s.x + drift, s.y, s.z, s.w, s.h,
             s.a * near * num(t / 0.6), 0.0, 1.0, mvp, VUP);
      }
      /* дальние облака за карточкой, потом сама карточка, потом передние */
      for (var i = 0; i < sprites.length; i++) if (sprites[i].z <= 0) spr(sprites[i], i);
      card();
      for (var i3 = sprites.length - 1; i3 >= 0; i3--) if (sprites[i3].z > 0) spr(sprites[i3], i3);

      /* белая пелена на проходе сквозь этаж облаков */
      if (isFinite(FREEZE)) {
        var px = new Uint8Array(4);
        gl.readPixels(Math.floor(W / 2), Math.floor(H / 2), 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, px);
        window.__spPix = [px[0], px[1], px[2], px[3]];
      }
      if (veilEl) {
        var g1 = Math.exp(-Math.pow((t - 0.05) / 0.78, 2));
        var g2 = Math.exp(-Math.pow((t - 2.30) / 0.50, 2));
        var v = Math.max(0, 0.96 * g1 + 0.52 * g2 - 0.06);
        veilEl.style.opacity = Math.min(0.94, v).toFixed(3);
      }
    }

    kick = function () { if (isFinite(FREEZE)) render(FREEZE); };

    var started = 0, raf = 0;
    function loop(now) {
      if (!started) started = now;
      render((now - started) / 1000);
      raf = window.requestAnimationFrame(loop);
    }

    if (isFinite(FREEZE)) {
      render(FREEZE);
    } else if (still) {
      render(4.95);
    } else {
      raf = window.requestAnimationFrame(loop);
    }

    return {
      stop: function () {
        if (raf) window.cancelAnimationFrame(raf);
        raf = 0;
      }
    };
  }

  var canvas = document.getElementById('sp-gl');
  var fly = null;
  if (canvas && !still) {
    try {
      fly = flight(canvas);
    } catch (e) {
      fly = null;
    }
  }
  if (fly) {
    splash.classList.add('sp-live');
    splash.classList.add('sp-play');
  } else {
    splash.classList.add('sp-no-3d');
  }

  function hide() {
    if (hidden) return;
    hidden = true;
    if (fly) fly.stop();
    splash.classList.add('sp-hide');
    setTimeout(function () {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 620);
  }

  function skip() {
    if (hidden || quick) return;
    quick = true;
    splash.classList.remove('sp-play');
    splash.classList.add('sp-hide');
    if (fly) fly.stop();
    setTimeout(hide, 240);
  }
  splash.addEventListener('click', skip);
  splash.addEventListener('touchstart', skip, { passive: true });
  window.addEventListener('keydown', skip);

  function maybeHide() {
    if (!ready || hidden) return;
    var left = Math.max(0, HOLD - (Date.now() - started));
    clearTimeout(holdTimer);
    holdTimer = setTimeout(hide, left);
  }

  window.addEventListener('ostrov-ready', function () {
    ready = true;
    maybeHide();
  });

  window.addEventListener('load', function () {
    setTimeout(function () { ready = true; maybeHide(); }, 60000);
  });
  setTimeout(function () { ready = true; maybeHide(); }, 75000);
})();
</script>

</body>
</html>
