<style id="ostrov-shell">
  html, body, #root {
    font-family: 'Inter-Regular', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    background-color: #f6f5f1;
  }
  html { -webkit-text-size-adjust: 100%; }

  /* ------------------------------------------------------------------
     ЭКРАН ЗАГРУЗКИ: падение с неба на глэмпинг за 5 секунд.

     Слои снизу вверх: четыре снимка земли (6400 → 800 м, шаг ровно 2×),
     настоящее фото облаков, белая пелена на входе в облако, дымка,
     зерно, виньетка, вспышка на посадке и надпись.
     ------------------------------------------------------------------ */
  #ostrov-splash {
    position: fixed; inset: 0; z-index: 9999; overflow: hidden;
    background: #0d1a22; color: #10120e;
    transition: opacity .5s ease;
    font-family: 'Inter-Regular', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    touch-action: manipulation;
  }
  #ostrov-splash.sp-hide { opacity: 0; }

  /* Камера: лёгкий крен на входе в падение, к земле выравнивается. */
  #ostrov-splash .sp-cam {
    position: absolute; inset: 0;
    transform: scale(1.1);
    transform-origin: 50% 48%;
  }

  /* Снимки земли. Кадр портретный и точно совпадает с окном просмотра,
     поэтому cover ничего не режет и стыки этажей совпадают пиксель в пиксель. */
  #ostrov-splash .sp-z {
    position: absolute; inset: 0;
    background-position: 50% 50%;
    background-size: cover;
    background-repeat: no-repeat;
    transform-origin: 50% 50%;
    will-change: transform, opacity;
  }
  #ostrov-splash .sp-z64 { background-image: url('./splash/zoom-6400m.jpg'); }
  #ostrov-splash .sp-z32 { background-image: url('./splash/zoom-3200m.jpg'); opacity: 0; }
  #ostrov-splash .sp-z16 { background-image: url('./splash/zoom-1600m.jpg'); opacity: 0; }
  #ostrov-splash .sp-z8  { background-image: url('./splash/zoom-800m.jpg');  opacity: 0; }

  /* Облака — настоящее фото сверху. */
  #ostrov-splash .sp-cloud {
    position: absolute; inset: 0;
    background: #223 url('./splash/cloud-field.jpg') 50% 30% / cover no-repeat;
    transform-origin: 50% 50%;
    will-change: transform, opacity;
  }

  /* Пелена: камера влетает в облако — кадр на мгновение становится белым. */
  #ostrov-splash .sp-veil {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: radial-gradient(130% 100% at 50% 44%, #ffffff 0%, #f2f5f5 62%, #e7edee 100%);
  }

  /* Дымка: воздух между нами и землёй, тает по мере снижения. */
  #ostrov-splash .sp-haze {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background: linear-gradient(to bottom,
      rgba(246,248,248,.92) 0%,
      rgba(244,247,247,.55) 26%,
      rgba(242,246,246,.18) 58%,
      rgba(255,255,255,0) 84%);
  }

  /* Бумажная крупа — чтобы картинка не выглядела стерильным скриншотом. */
  #ostrov-splash .sp-grain {
    position: absolute; inset: 0; pointer-events: none;
    opacity: .075;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='140' height='140' filter='url(%23n)'/></svg>");
  }

  /* Виньетка: взгляд вниз, по краям темнее. */
  #ostrov-splash .sp-vignette {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(112% 74% at 50% 46%, rgba(0,0,0,0) 34%, rgba(9,16,13,.58) 100%);
  }

  /* Вспышка на посадке. */
  #ostrov-splash .sp-flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

  /* Затемнение под надписью: садится вместе с камерой. */
  #ostrov-splash .sp-scrim {
    position: absolute; inset: 0; pointer-events: none; opacity: 0;
    background:
      radial-gradient(74% 28% at 50% 58%, rgba(8,12,10,.40) 0%, rgba(8,12,10,.20) 52%, rgba(8,12,10,0) 82%),
      linear-gradient(to bottom, rgba(8,12,10,.20) 0%, rgba(8,12,10,0) 24%, rgba(8,12,10,0) 76%, rgba(8,12,10,.24) 100%);
  }

  /* Надпись: тонкая, разреженная, в две строки с волоском под ней. */
  #ostrov-splash .sp-lockup {
    position: absolute; left: 0; right: 0; top: 60%;
    transform: translateY(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    text-align: center; padding: 0 24px;
    opacity: 0;
  }
  #ostrov-splash .sp-small {
    font-size: 10px; letter-spacing: .38em; text-transform: uppercase;
    color: rgba(251,247,244,.9);
    text-shadow: 0 1px 14px rgba(0,0,0,.75);
  }
  #ostrov-splash .sp-name {
    font-family: 'CormorantGaramond-Regular', 'Cormorant Garamond', Georgia, 'Times New Roman', serif;
    font-size: clamp(36px, 11vw, 54px);
    letter-spacing: .17em; text-transform: uppercase; line-height: 1;
    color: #fbf7f4;
    text-shadow: 0 2px 30px rgba(0,0,0,.7), 0 1px 2px rgba(0,0,0,.5);
    margin-left: .17em;
  }
  #ostrov-splash .sp-line {
    width: 124px; height: 2px; background: rgba(251,247,244,.26);
    overflow: hidden; border-radius: 2px; margin-top: 6px;
  }
  #ostrov-splash .sp-line i {
    display: block; height: 100%; width: 100%; background: #c2603f; border-radius: 2px;
    transform-origin: left center;
  }

  /* ------------------------------------------------------------------
     Тайминг: 0.00 облака → 0.95 пелена → 1.30 земля → 3.35 посадка.
     ------------------------------------------------------------------ */
  @media (prefers-reduced-motion: no-preference) {
    #ostrov-splash.sp-play .sp-cam    { animation: sp-cam 5s cubic-bezier(.3,.1,.3,1) forwards; }
    #ostrov-splash.sp-play .sp-cloud  { animation: sp-cloud 5s cubic-bezier(.4,0,.75,1) forwards; }
    #ostrov-splash.sp-play .sp-z64    { animation: sp-z64 5s linear forwards; }
    #ostrov-splash.sp-play .sp-z32    { animation: sp-z32 5s linear forwards; }
    #ostrov-splash.sp-play .sp-z16    { animation: sp-z16 5s linear forwards; }
    #ostrov-splash.sp-play .sp-z8     { animation: sp-z8 5s linear forwards; }
    #ostrov-splash.sp-play .sp-veil   { animation: sp-veil 5s ease-in-out forwards; }
    #ostrov-splash.sp-play .sp-haze   { animation: sp-haze 5s ease-out forwards; }
    #ostrov-splash.sp-play .sp-scrim  { animation: sp-scrim 5s ease-in-out forwards; }
    #ostrov-splash.sp-play .sp-lockup { animation: sp-lockup 5s cubic-bezier(.2,.8,.3,1) forwards; }
    #ostrov-splash.sp-play .sp-line i { animation: sp-line 5s linear forwards; }
    #ostrov-splash.sp-play .sp-flash  { animation: sp-flash 5s ease-out forwards; }
  }

  /* Крен: входим в падение с наклоном, у земли выравниваемся. */
  @keyframes sp-cam {
    0%   { transform: scale(1.12) rotate(-1.6deg); }
    25%  { transform: scale(1.09) rotate(.8deg); }
    45%  { transform: scale(1.06) rotate(-.4deg); }
    70%  { transform: scale(1.03) rotate(.15deg); }
    100% { transform: scale(1.02) rotate(0deg); }
  }

  /* Облака: летят навстречу и уходят за кадр. */
  @keyframes sp-cloud {
    0%   { opacity: 1; transform: scale(1.06) translateY(0); }
    10%  { opacity: 1; transform: scale(1.19) translateY(.6%); }
    14%  { opacity: 1; transform: scale(1.26) translateY(1.2%); }
    18%  { opacity: 1; transform: scale(1.32) translateY(1.8%); }
    22%  { opacity: 0; transform: scale(1.36) translateY(2.4%); }
    100% { opacity: 0; transform: scale(1.36) translateY(2.4%); }
  }

  /* Пелена: влетаем в облако, всё белеет, кадр меняется в белизне. */
  @keyframes sp-veil {
    0%    { opacity: 0; }
    13%   { opacity: 0; }
    17.5% { opacity: 1; }
    20%   { opacity: 1; }
    26%   { opacity: 0; }
    100%  { opacity: 0; }
  }

  /* Слой 6400 м: 0.95 → 1.75 с, ровно два раза. */
  @keyframes sp-z64 {
    0%, 19% { opacity: 1; transform: scale(1); }
    23%     { transform: scale(1.19); }
    27%     { transform: scale(1.41); }
    31%     { transform: scale(1.68); }
    35%     { opacity: 1; transform: scale(2); }
    36.5%   { opacity: 0; transform: scale(2); }
    100%    { opacity: 0; transform: scale(2); }
  }

  /* Слой 3200 м: 1.75 → 2.55 с. */
  @keyframes sp-z32 {
    0%, 35% { opacity: 0; transform: scale(1); }
    36.5%   { opacity: 1; transform: scale(1); }
    40%     { transform: scale(1.24); }
    44%     { transform: scale(1.48); }
    48%     { transform: scale(1.76); }
    51%     { opacity: 1; transform: scale(2); }
    52.5%   { opacity: 0; transform: scale(2); }
    100%    { opacity: 0; transform: scale(2); }
  }

  /* Слой 1600 м: 2.55 → 3.35 с. */
  @keyframes sp-z16 {
    0%, 51% { opacity: 0; transform: scale(1); }
    52.5%   { opacity: 1; transform: scale(1); }
    56%     { transform: scale(1.24); }
    60%     { transform: scale(1.48); }
    64%     { transform: scale(1.76); }
    67%     { opacity: 1; transform: scale(2); }
    68.5%   { opacity: 0; transform: scale(2); }
    100%    { opacity: 0; transform: scale(2); }
  }

  /* Слой 800 м: посадка — скорость гаснет, кадр мягко доезжает. */
  @keyframes sp-z8 {
    0%, 67% { opacity: 0; transform: scale(1); }
    68.5%   { opacity: 1; transform: scale(1); }
    72%     { transform: scale(1.14); }
    76%     { transform: scale(1.28); }
    80%     { transform: scale(1.37); }
    84%     { opacity: 1; transform: scale(1.41); }
    88%     { opacity: 1; transform: scale(1.42); }
    100%    { opacity: 1; transform: scale(1.425); }
  }

  /* Дымка: держится на высоте, к земле рассеивается. */
  @keyframes sp-haze {
    0%   { opacity: 0; }
    26%  { opacity: .62; }
    35%  { opacity: .46; }
    55%  { opacity: .26; }
    75%  { opacity: .10; }
    88%  { opacity: .05; }
    100% { opacity: .03; }
  }

  @keyframes sp-scrim {
    0%, 68% { opacity: 0; }
    84%     { opacity: 1; }
    100%    { opacity: 1; }
  }

  /* Надпись встаёт, когда земля уже на месте. */
  @keyframes sp-lockup {
    0%, 68% { opacity: 0; transform: translateY(-50%) scale(.97); }
    80%     { opacity: 1; transform: translateY(-50%) scale(1); }
    100%    { opacity: 1; transform: translateY(-50%) scale(1.005); }
  }

  /* Волосок под надписью — «как идёт загрузка». */
  @keyframes sp-line {
    0%, 74% { transform: scaleX(0); }
    90%     { transform: scaleX(.62); }
    97%     { transform: scaleX(.92); }
    100%    { transform: scaleX(1); }
  }

  /* Вспышка на посадке. */
  @keyframes sp-flash {
    0%, 80% { opacity: 0; }
    86%     { opacity: .14; }
    92%     { opacity: 0; }
    100%    { opacity: 0; }
  }

  /* Меньше движения: сразу тихий финальный кадр с надписью. */
  @media (prefers-reduced-motion: reduce) {
    #ostrov-splash .sp-cloud { display: none; }
    #ostrov-splash .sp-z64 { display: none; }
    #ostrov-splash .sp-z32 { display: none; }
    #ostrov-splash .sp-z16 { display: none; }
    #ostrov-splash .sp-z8 { opacity: 1; transform: scale(1.08); }
    #ostrov-splash .sp-haze { opacity: .12; }
    #ostrov-splash .sp-flash { opacity: 0; }
    #ostrov-splash .sp-scrim { opacity: 1; }
    #ostrov-splash .sp-lockup { opacity: 1; }
    #ostrov-splash .sp-line i { transform: scaleX(.7); }
  }
</style>

<script>
/* Экран загрузки «падение с неба» — ровно 5 секунд.
     • анимация один раз за сессию; ?splash=1 — посмотреть ещё раз;
     • убираем заставку, когда и анимация дошла до надписи, и первый экран
       приложения готов;
     • касание перематывает к надписи;
     • страховки снимают заставку, если приложение не подало сигнал. */
(function () {
  var splash = document.getElementById('ostrov-splash');
  if (!splash) return;

  var HOLD = 4500;          /* кадр доезжает к 4.5 с, ещё 0.5 с — растворение */
  var started = Date.now();
  var ready = false;
  var hidden = false;
  var holdTimer = 0;

  /* ?splash=1 — показать заставку заново, даже если в этой сессии уже видели. */
  var force = /[?&]splash=1/.test(location.search);
  if (force) { try { sessionStorage.removeItem('ostrov-splash-seen'); } catch (e) {} }

  var seen = false;
  try { seen = !force && sessionStorage.getItem('ostrov-splash-seen') === '1'; } catch (e) {}

  var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var quick = seen || calm;

  if (!quick) splash.classList.add('sp-play');

  /* Все пять кадров просим заранее: иначе поздние слои догружаются на глазах. */
  ['cloud-field.jpg', 'zoom-6400m.jpg', 'zoom-3200m.jpg', 'zoom-1600m.jpg', 'zoom-800m.jpg']
    .forEach(function (name) {
      var img = new Image();
      img.src = './splash/' + name;
    });

  function hide() {
    if (hidden) return;
    hidden = true;
    splash.classList.add('sp-hide');
    try { sessionStorage.setItem('ostrov-splash-seen', '1'); } catch (e) {}
    setTimeout(function () {
      if (splash.parentNode) splash.parentNode.removeChild(splash);
    }, 600);
  }

  function maybeHide() {
    if (!ready) return;
    var left = Math.max(0, (quick ? 240 : HOLD) - (Date.now() - started));
    clearTimeout(holdTimer);
    holdTimer = setTimeout(hide, left);
  }

  window.addEventListener('ostrov-ready', function () {
    ready = true;
    maybeHide();
  });

  function skip() {
    if (hidden || quick) return;
    quick = true;
    splash.classList.remove('sp-play');
    maybeHide();
  }
  splash.addEventListener('click', skip);
  splash.addEventListener('touchstart', skip, { passive: true });
  window.addEventListener('keydown', skip);

  window.addEventListener('load', function () {
    setTimeout(function () { ready = true; maybeHide(); }, 8000);
  });
  setTimeout(function () { ready = true; maybeHide(); }, 15000);
})();
</script>
